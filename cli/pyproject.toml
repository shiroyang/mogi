[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mogi-cli"
version = "0.1.0"
description = "Command-line client for mogi — solve the 真題 corpus from any editor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mogi = "mogi_cli.cli:main"

[tool.setuptools.packages.find]
include = ["mogi_cli*"]
